name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 依存パッケージのインストール
        run: pip install pytest matplotlib
      - name: テスト実行
        run: python -m pytest test_triangle.py -v
